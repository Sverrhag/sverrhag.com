<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letter Adventure</title>
<meta name="description" content="A playful letter-learning game for children from about age 4, in Swedish and English. Five small games with a cheerful voice guide, unicorns and ladybugs.">
<meta property="og:title" content="Letter Adventure / Bokstavsäventyret">
<meta property="og:description" content="A playful letter-learning game for young children, in Swedish and English.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Letter Adventure">
<meta name="theme-color" content="#ffd9ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦄%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;600;700&display=swap">
<style>
/* Layout: one screen at a time, everything fits without scrolling on a tablet.
   Top: guide bubble. Middle: big letter. Bottom: progress + keyboard. */
:root{
  --sky1:#ffd9ec; --sky2:#e9dcff; --sky3:#d2f0ff;
  --card:#ffffff; --ink:#48266b; --ink-soft:#7d5f9c;
  --pink:#ff5fa2; --pink-deep:#d92d7f;
  --r1:#ff7a93; --r2:#ffa552; --r3:#ffd84a; --r4:#6ad895; --r5:#69bcff; --r6:#b893ff;
  --on-color:#3a1b5c;
  --shadow:rgba(110,60,160,.28); --line:rgba(110,60,160,.18);
  --empty:#f3eafc;
  --f-ui:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --f-abc:"Andika","Century Gothic","Trebuchet MS",sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --sky1:#2b1650; --sky2:#1f1546; --sky3:#12224a;
  --card:#3a2866; --ink:#fdeeff; --ink-soft:#cdb6ea;
  --pink:#ff7ab4; --pink-deep:#ff9cc8;
  --shadow:rgba(0,0,0,.55); --line:rgba(255,255,255,.18);
  --empty:#2c1d52; color-scheme:dark } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; overflow:hidden; color:var(--ink); font-family:var(--f-ui); font-size:18px;
  background:linear-gradient(160deg,var(--sky1),var(--sky2) 50%,var(--sky3));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font:inherit; color:inherit; cursor:pointer; border:0}
input{user-select:text; -webkit-user-select:text}
a{color:inherit}
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible{outline:4px solid var(--r5); outline-offset:3px}

.rainbow{position:fixed; left:50%; bottom:-62vmin; width:130vmin; height:130vmin; transform:translateX(-50%); border-radius:50%; opacity:.4; pointer-events:none;
  background:radial-gradient(circle closest-side, transparent 0 76%, var(--r6) 76% 80%, var(--r5) 80% 84%, var(--r4) 84% 88%, var(--r3) 88% 92%, var(--r2) 92% 96%, var(--r1) 96% 100%)}
.cloud{position:fixed; width:150px; height:46px; border-radius:40px; background:var(--card); opacity:.55; pointer-events:none; animation:drift 60s linear infinite}
.cloud::before,.cloud::after{content:""; position:absolute; background:var(--card); border-radius:50%}
.cloud::before{width:64px; height:64px; left:22px; top:-30px}
.cloud::after{width:48px; height:48px; right:26px; top:-20px}
.cloud.c1{top:8%; left:-10%} .cloud.c2{top:30%; left:-30%; animation-duration:85s; animation-delay:-40s; transform:scale(.7)}
@keyframes drift{to{left:110%}}

.screen{display:none; position:relative; height:100%; flex-direction:column; gap:10px; overflow-y:auto; overflow-x:hidden}
.screen.on{display:flex}

/* --- shared --- */
.bubble{background:var(--card); border-radius:26px; padding:10px 18px; box-shadow:0 5px 0 var(--line); font-weight:600; font-size:clamp(17px,2.6vh,26px); line-height:1.25; min-width:0; flex:1; display:flex; align-items:center; gap:12px}
.bubble .who{font-size:1.9em; line-height:1; animation:bob 2.4s ease-in-out infinite}
.bubble .say{min-width:0}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.round{width:58px; height:58px; flex:none; border-radius:50%; background:var(--card); box-shadow:0 5px 0 var(--line); font-size:28px; display:grid; place-items:center}
.round:active,.big:active,.game:active,.key:active,.choice:active{transform:translateY(4px); box-shadow:none}
.stars{flex:none; background:var(--r3); color:var(--on-color); border-radius:30px; padding:8px 16px; font-weight:700; font-size:22px; box-shadow:0 5px 0 var(--line); font-variant-numeric:tabular-nums}
.big{background:var(--pink); color:#fff; font-weight:700; font-size:clamp(22px,4vh,34px); padding:.55em 1.3em; border-radius:999px; box-shadow:0 7px 0 var(--line)}
.big.alt{background:var(--card); color:var(--ink)}
h1{font-size:clamp(38px,9vh,84px); margin:0; line-height:1; color:var(--pink-deep); text-wrap:balance; letter-spacing:.01em}
.seg{display:inline-flex; background:var(--card); border-radius:999px; padding:5px; box-shadow:0 5px 0 var(--line); gap:4px}
.seg button{background:transparent; border-radius:999px; padding:8px 18px; font-weight:700; font-size:22px; min-width:74px}
.seg button[aria-pressed="true"]{background:var(--r6); color:var(--on-color)}
.row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:center}

/* --- start --- */
.startbox{margin:auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; width:100%; max-width:680px; padding:8px 0 20px}
.hero{font-size:clamp(70px,16vh,150px); line-height:1; animation:bob 2.4s ease-in-out infinite}
#start h1{font-size:clamp(34px,7vh,68px)}
.tagline{margin:0; font-size:clamp(17px,2.6vh,22px); color:var(--ink-soft); font-weight:600}
.namebox{display:flex; flex-direction:column; gap:8px; align-items:center; width:100%}
.namebox label{font-weight:700; font-size:22px}
#name{font:inherit; font-size:28px; font-weight:600; text-align:center; width:min(100%,380px); padding:10px 18px; border-radius:999px; border:4px solid var(--r6); background:var(--card); color:var(--ink)}
#name::placeholder{color:var(--ink-soft); opacity:.7; font-weight:400}
.about{background:var(--card); border-radius:26px; padding:16px 22px; box-shadow:0 5px 0 var(--line); text-align:left; font-size:16px; line-height:1.5; margin-top:10px}
.about h2{margin:0 0 4px; font-size:20px}
.about p{margin:0 0 8px}
.about ul{margin:0 0 8px; padding:0; list-style:none; display:grid; gap:2px}
.about .tip{color:var(--ink-soft); font-size:15px; margin:0}.back{font-size:15px; color:var(--ink-soft); text-decoration:none; font-weight:600}
.back:hover{text-decoration:underline}

.vlabel{font-weight:700; font-size:18px}
.voices{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.voice{background:var(--card); border-radius:20px; padding:6px 8px 8px; min-width:88px; box-shadow:0 4px 0 var(--line); display:flex; flex-direction:column; align-items:center; font-weight:600; font-size:14px; line-height:1.2; border:3px solid transparent}
.voice span{font-size:34px; line-height:1.2}
.voice[aria-pressed="true"]{border-color:var(--pink); background:var(--empty)}
dialog .voices{width:100%}
dialog .voice{box-shadow:none; background:var(--empty); min-width:76px}
dialog .voice[aria-pressed="true"]{background:var(--card)}

/* --- win --- */
#win{align-items:center; justify-content:center; text-align:center; gap:2vh}
#win .bubble{flex:none; max-width:720px}
#prize{font-size:clamp(100px,28vh,240px); line-height:1; animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}

.seg.nums button{min-width:52px; padding-left:10px; padding-right:10px}
#levelChip{background:var(--card); box-shadow:0 5px 0 var(--line); font-size:18px; padding:10px 18px}

#install{margin-top:12px; padding-top:10px; border-top:2px solid var(--line)}
#install ul{gap:6px}
#installBtn{background:var(--pink); color:#fff; font-size:18px; padding:10px 20px; margin-bottom:10px}
#installed{margin:12px 0 0; padding-top:10px; border-top:2px solid var(--line); font-weight:600}

/* --- top list --- */
.board{width:100%; max-width:420px; text-align:left}
#result{background:var(--card); border-radius:26px; padding:12px 20px; box-shadow:0 5px 0 var(--line)}
#yourTime{margin:0 0 6px; font-weight:700; font-size:20px; text-align:center}
.board ol{margin:0; padding:0 0 0 1.6em; font-size:18px; line-height:1.5; font-variant-numeric:tabular-nums}
.board li{padding:0 6px; border-radius:10px}
.board li span{display:inline-block; min-width:9em; overflow-wrap:anywhere}
.board li.me{background:var(--r3); color:var(--on-color); font-weight:700}
#win.timed #prize{font-size:clamp(60px,12vh,110px)}
#timer{background:var(--card); color:var(--ink)}
#card.tap{cursor:pointer}

/* --- home --- */
.top{display:flex; gap:12px; align-items:center; flex:none}
#home h1{font-size:clamp(28px,6vh,56px); flex:1; min-width:0; overflow-wrap:anywhere}
.games{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; flex:1; min-height:120px; max-height:210px}
.sec{margin:0; flex:none; font-weight:700; font-size:17px; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase}
.choice.word{font-size:clamp(26px,7vh,60px); width:auto; padding:.2em .7em}
#card.wordcard{font-size:clamp(44px,12vh,110px); padding:.15em .5em}
.slot.given{opacity:1; color:var(--ink)}
.game{border-radius:30px; padding:12px 10px; color:var(--on-color); font-weight:700; font-size:clamp(19px,2.9vh,26px); box-shadow:0 7px 0 var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; line-height:1.1}
.game .em{font-size:clamp(44px,9vh,80px); line-height:1.1}
.game small{font-weight:400; font-size:.68em}
.game .num{position:absolute; top:10px; left:12px; width:30px; height:30px; border-radius:50%; background:var(--card); color:var(--ink); font-size:17px; display:grid; place-items:center}
.homebar{display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; flex:none}
#caseSeg button{font-family:var(--f-abc)}
.shelf{background:var(--card); border-radius:26px; padding:10px 16px; box-shadow:0 5px 0 var(--line); flex:none}
.shelf b{display:block; font-size:17px; margin-bottom:2px}
#stickers{font-size:clamp(26px,4.5vh,38px); line-height:1.25; letter-spacing:.08em; min-height:1.3em; overflow-wrap:anywhere}
#stickers.none{font-size:16px; color:var(--ink-soft); letter-spacing:0}
.walker{position:absolute; bottom:2px; left:-60px; font-size:34px; animation:walk 26s linear infinite; pointer-events:none}
@keyframes walk{to{left:105%}}

/* --- game --- */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh}
#card{background:var(--card); border-radius:40px; box-shadow:0 10px 0 var(--line), 0 18px 40px var(--shadow); padding:.02em .32em .08em; min-width:1.7em; text-align:center;
  font-family:var(--f-abc); font-weight:700; font-size:clamp(84px,27vh,250px); line-height:1.15; color:var(--pink-deep); white-space:nowrap}
#card.compact{font-size:clamp(60px,15vh,130px)}
#card.yay{animation:yay .5s}
#card.no{animation:no .4s}
@keyframes yay{40%{transform:scale(1.14) rotate(3deg)}}
@keyframes no{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
#card .pic{display:block; font-size:.5em; line-height:1.2}
.slots{display:flex; gap:.12em; justify-content:center; font-size:min(11vh,calc(84vw / var(--n) / 1.25)); padding:.15em 0 .2em}
.slot{width:1.1em; height:1.35em; border-radius:.22em; background:var(--empty); color:var(--ink-soft); display:grid; place-items:center; line-height:1; opacity:.75}
.slot.done{background:var(--r4); color:var(--on-color); opacity:1}
.slot.now{outline:.07em solid var(--pink); opacity:1; animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.09)}}
#choices{display:flex; gap:2.2vw; flex-wrap:wrap; justify-content:center}
.choice{font-family:var(--f-abc); font-weight:700; font-size:clamp(50px,15vh,130px); line-height:1.2; width:1.55em; border-radius:.26em; color:var(--on-color); box-shadow:0 8px 0 var(--line)}
.choice.hint,.key.hint{animation:pulse .7s infinite; outline:5px solid var(--pink); position:relative; z-index:1}

#progress{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; flex:none; padding-top:20px}
.dot{width:clamp(24px,2.7vw,40px); height:clamp(24px,2.7vw,40px); border-radius:50%; background:var(--empty); color:var(--ink-soft); font-family:var(--f-abc); font-weight:700; font-size:clamp(13px,1.5vw,21px); display:grid; place-items:center; position:relative}
.dot.done{color:var(--on-color)}
.dot.now{outline:3px solid var(--pink)}
.dot.now::after{content:"🐞"; position:absolute; top:-1.15em; left:50%; transform:translateX(-50%); font-size:1.15em; animation:bob 1s infinite}
.pip{width:clamp(34px,6vh,52px); height:clamp(34px,6vh,52px); border-radius:50%; border:3px dashed var(--line); display:grid; place-items:center; font-size:clamp(22px,4.2vh,36px); line-height:1}
.pip.done{border-color:transparent; animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

#kb{flex:none; display:flex; flex-direction:column; gap:.7vh; align-items:center; --k:min(7.4vw,8.2vh,72px); padding-bottom:4px}
#kb .kr{display:flex; gap:.5vw}
#kb .kr:nth-child(2){margin-left:calc(var(--k) * .35)}
.key{width:var(--k); height:var(--k); border-radius:calc(var(--k) * .26); background:var(--card); box-shadow:0 4px 0 var(--line); font-family:var(--f-abc); font-weight:700; font-size:calc(var(--k) * .54); line-height:1; padding:0}

#fx{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
#fx span{position:absolute; font-size:34px; will-change:transform}

/* --- settings --- */
dialog{border:0; border-radius:30px; background:var(--card); color:var(--ink); padding:22px; width:min(520px,calc(100vw - 32px)); max-height:calc(100% - 32px); box-shadow:0 20px 60px var(--shadow); font-family:var(--f-ui)}
dialog::backdrop{background:rgba(40,15,70,.55)}
dialog h2{margin:0 0 12px; font-size:26px}
.opt{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 0; border-top:2px solid var(--line); flex-wrap:wrap}
.opt label{font-weight:600}
.opt select{font:inherit; padding:6px 10px; border-radius:12px; max-width:240px; background:var(--empty); color:var(--ink); border:2px solid var(--line)}
.opt input[type=checkbox]{width:28px; height:28px; accent-color:var(--pink)}
.opt input[type=range]{width:180px; accent-color:var(--pink)}
.pill{background:var(--empty); border-radius:999px; padding:8px 16px; font-weight:600; font-size:16px}
.note{color:var(--ink-soft); font-size:15px; margin:6px 0 0}
dialog .seg{box-shadow:none; background:var(--empty)}
dialog .seg button{font-size:18px; padding:6px 14px}

@media (max-width:560px){ .cloud{display:none} .stars{font-size:18px; padding:6px 10px} .round{width:48px; height:48px; font-size:23px} .games{max-height:none} .bubble .who{display:none} }
@media (prefers-reduced-motion: reduce){ .cloud,.walker,.hero,.bubble .who{animation:none} }
</style>
</head>
<body>

<div class="rainbow"></div><div class="cloud c1"></div><div class="cloud c2"></div>

<section class="screen on" id="start">
  <div class="startbox">
    <div class="hero">🦄</div>
    <h1 id="gameTitle">Letter Adventure</h1>
    <p class="tagline" data-t="tagline"></p>
    <div class="seg" id="langSeg" role="group" aria-label="Språk / Language">
      <button data-lang="sv">Svenska</button><button data-lang="en">English</button>
    </div>
    <div class="namebox">
      <label for="name" data-t="nameLabel"></label>
      <input id="name" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
    </div>
    <div class="vlabel" data-t="ageLabel"></div>
    <div class="seg nums" id="ageSeg" role="group" data-ta="ageLabel">
      <button data-age="3">3</button><button data-age="4">4</button><button data-age="5">5</button><button data-age="6">6</button><button data-age="7">7</button>
    </div>
    <div class="vlabel" data-t="setVoiceName"></div>
    <div class="voices" role="group" data-ta="setVoiceName"></div>
    <button class="big" id="go" data-t="start"></button>
    <div class="about">
      <h2 data-t="aboutH"></h2>
      <p data-t="about"></p>
      <ul id="aboutList"></ul>
      <p class="tip" data-t="tip"></p>
      <div id="install">
        <h2 data-t="installH"></h2>
        <p data-t="installIntro"></p>
        <button class="pill" id="installBtn" data-t="installBtn" hidden></button>
        <ul id="installSteps"></ul>
      </div>
      <p id="installed" data-t="installed" hidden></p>    </div>
    <a class="back" href="/#projects">← sverrhag.com</a>
  </div>
</section>

<section class="screen" id="home">
  <div class="top">
    <h1 id="homeTitle"></h1>
    <span class="stars">⭐ <span class="starcount">0</span></span>
    <button class="round" id="openBoard" data-ta="boardH">🏆</button>
    <button class="round" id="openSettings" data-ta="setH">⚙️</button>
  </div>
  <div class="top"><div class="bubble"><span class="who">🦄</span><span class="say"></span></div></div>
  <p class="sec" data-t="secLetters"></p>
  <div class="games" id="games"></div>
  <p class="sec" data-t="secWords"></p>
  <div class="games" id="games2"></div>
  <div class="homebar">
    <div class="seg" id="caseSeg" role="group" data-ta="setLetters">
      <button data-case="upper">ABC</button><button data-case="lower">abc</button><button data-case="both">Aa</button>
    </div>
    <button class="pill" id="levelChip"></button>
  </div>
  <div class="shelf"><b id="shelfTitle"></b><div id="stickers"></div></div>
  <span class="walker">🐞</span>
</section>

<section class="screen" id="game">
  <div class="top">
    <button class="round" id="toHome" data-ta="ariaHome">🏠</button>
    <div class="bubble"><span class="who">🦄</span><span class="say"></span></div>
    <button class="round" id="again" data-ta="ariaAgain">🔊</button>
    <span class="stars" id="timer" hidden>⏱ 0:00</span>
    <span class="stars">⭐ <span class="starcount">0</span></span>
  </div>
  <div class="stage"><div id="card"></div><div id="choices"></div></div>
  <div id="progress"></div>
  <div id="kb"></div>
</section>

<section class="screen" id="win">
  <div id="prize">🦄</div>
  <h1 id="winTitle"></h1>
  <div class="bubble"><span class="who">🐞</span><span class="say"></span></div>
  <div class="board" id="result" hidden>
    <p id="yourTime"></p>
    <ol id="winBoard"></ol>
  </div>
  <div class="row"><button class="big" id="replay" data-t="replay"></button><button class="big alt" id="winHome" data-t="winHome"></button></div>
</section>

<div id="fx"></div>

<dialog id="settings">
  <h2 data-t="setH"></h2>
  <div class="opt"><label data-t="setLetters"></label>
    <div class="seg" role="group">
      <button data-case="upper" data-t="caseU"></button><button data-case="lower" data-t="caseL"></button><button data-case="both" data-t="caseB"></button>
    </div></div>
  <div class="opt"><label data-t="setLevel"></label>
    <div class="seg nums" role="group" data-ta="setLevel">
      <button data-level="1">1</button><button data-level="2">2</button><button data-level="3">3</button><button data-level="4">4</button><button data-level="5">5</button>
    </div></div>
  <div class="opt"><label for="optVoice" data-t="setVoice"></label><input type="checkbox" id="optVoice"></div>
  <div class="opt"><label data-t="setVoiceName"></label><div class="voices" role="group" data-ta="setVoiceName"></div></div>
  <div class="opt"><label for="optRate" data-t="setRate"></label><input type="range" id="optRate" min="0.8" max="1.2" step="0.05"></div>
  <div class="opt"><label for="optSfx" data-t="setSfx"></label><input type="checkbox" id="optSfx"></div>
  <div class="opt"><label for="optKb" data-t="setKb"></label><input type="checkbox" id="optKb"></div>
  <div class="opt"><button class="pill" id="fullscreen" data-t="setFull"></button><button class="pill" id="reset" data-t="setReset"></button></div>
  <div class="opt"><button class="pill" id="changeName" data-t="setChange"></button><button class="big" id="closeSettings" style="font-size:20px" data-t="setDone"></button></div>
</dialog>

<dialog id="boardDlg">
  <h2 id="boardTitle"></h2>
  <div class="board">
    <ol id="boardList"></ol>
    <p class="note" id="boardEmpty" data-t="boardEmpty"></p>
  </div>
  <p class="note" data-t="boardNote"></p>
  <div class="opt" style="justify-content:flex-end"><button class="big" id="closeBoard" style="font-size:20px" data-t="close"></button></div>
</dialog>
