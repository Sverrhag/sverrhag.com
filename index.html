<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sverrhag Consulting</title>
<meta name="description" content="Sverrhag Consulting — a home for small projects and experiments.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="logo" aria-label="Sverrhag Consulting home">
    <span>Sverrhag</span>
    <span>Consulting</span>
  </a>
  <nav class="site-nav">
    <a href="#projects">Projects</a>
    <a href="https://www.linkedin.com/in/christiansverrhag/" target="_blank" rel="noopener">LinkedIn</a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-media">
      <picture>
        <source srcset="assets/img/hero.webp" type="image/webp">
        <img src="assets/img/hero.jpg" alt="Silhouette of a handstand on a floating platform at sunset over the sea" loading="eager">
      </picture>
    </div>
    <div class="hero-content">
      <button type="button" class="hero-portrait" id="portrait-trigger" aria-haspopup="dialog" aria-label="Open full-size photo">
        <picture>
          <source srcset="assets/img/headshot-avatar.webp?v=5" type="image/webp">
          <img src="assets/img/headshot-avatar.jpg?v=5" alt="Portrait of Christian Sverrhag">
        </picture>
      </button>
      <h1>Sverrhag Consulting</h1>
      <p class="hero-tagline">A home for small projects and experiments.</p>
    </div>
  </section>

  <section id="projects" class="projects">
    <h2>Projects</h2>
    <div class="projects-grid" id="projects-grid"></div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full-size photo" hidden>
  <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img src="assets/img/headshot.jpg?v=5" alt="Portrait of Christian Sverrhag">
</div>

<footer class="site-footer">
  <span>&copy; <span id="year"></span> Sverrhag Consulting</span>
  <a href="https://www.linkedin.com/in/christiansverrhag/" target="_blank" rel="noopener">LinkedIn</a>
</footer>

<script src="projects/projects.js" defer></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
